<div class="monk-mode-section" id="monk-mode-section">
    <div class="monk-glass-overlay">
        <header class="monk-mode-header">
            <div class="monk-title-block">
                <p>90-DAY PROTOCOL</p>
                <h3>MONK MODE</h3>
            </div>
            
            <div class="monk-header-actions">
                <button class="monk-toggle-btn" id="monk-sfx-toggle" title="Toggle Soundscapes">
                    <span class="monk-sfx-icon">🔊</span>
                    <span class="monk-sfx-status">ENABLED</span>
                </button>
            </div>
        </header>

        <div class="monk-mode-body">
            <div class="premium-card monk-rules-banner">
                <div class="monk-rules-header-row">
                    <span class="monk-rules-badge">IRON RULES</span>
                    <span class="monk-rules-subtitle">VIOLATION = RESET</span>
                </div>
                <div class="monk-rules-list">
                    <div class="monk-rule-item"><div class="monk-rule-dot"></div><span>NO ADDICTIONS / NO WEAKNESS</span></div>
                    <div class="monk-rule-item"><div class="monk-rule-dot"></div><span>100% DAILY COMPLETION</span></div>
                    <div class="monk-rule-item"><div class="monk-rule-dot"></div><span>NO SKIPS / NO PAUSES</span></div>
                </div>
            </div>

            <div class="monk-live-panel">
                <div class="monk-stats">
                    <div class="monk-ring-wrap">
                        <div class="monk-progress-ring">
                            <svg class="monk-ring-svg" viewBox="0 0 120 120">
                                <circle class="monk-ring-bg" cx="60" cy="60" r="54"></circle>
                                <circle class="monk-ring-fg" id="monk-ring-fill" cx="60" cy="60" r="54" style="stroke-dashoffset: 339; stroke-dasharray: 339;"></circle>
                            </svg>
                            <div class="monk-ring-center">
                                <span class="monk-ring-value" id="monk-progress-percent">0%</span>
                                <span class="monk-ring-label">ASCENSION</span>
                            </div>
                        </div>
                    </div>

                    <div class="monk-streak-block">
                        <span class="monk-streak-label">STREAK</span>
                        <div class="monk-streak-value" id="monk-streak-val">0</div>
                    </div>

                    <div class="monk-days-remaining">
                        <span class="monk-days-label">STAGE</span>
                        <div class="monk-days-value"><span id="monk-current-day">1</span><span class="monk-days-total">/90</span></div>
                    </div>
                </div>

                <div class="premium-card monk-tasks" style="margin-top: 1.5rem;">
                    <div class="monk-tasks-header">
                        <h4 class="monk-tasks-title">Daily Contracts</h4>
                        <span class="monk-tasks-sub" id="monk-tasks-remaining">PENDING</span>
                    </div>
                    
                    <div class="monk-task-grid" id="monk-task-grid">
                        <!-- Populated by JS -->
                    </div>

                    <div class="monk-actions" style="margin-top: 1.5rem;">
                        <button class="monk-complete-day-btn" id="monk-complete-day-btn">
                            FINALIZE CURRENT STAGE
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/monk_mode.js') }}?v=AAA"></script>
