{% extends "base.html" %}
{% block title %}Server Error — FitAI{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-illustration">⚡</div>
  <div class="error-code">500</div>
  <h1 class="error-title">Something Went Wrong</h1>
  <p class="error-sub">Our servers are catching their breath. Please try again in a moment.</p>
  <div class="error-actions">
    <a href="{{ url_for('dashboard.index') }}" class="btn-primary">🏠 Back to Dashboard</a>
  </div>
</div>
{% endblock %}
