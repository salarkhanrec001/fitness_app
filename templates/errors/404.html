{% extends "base.html" %}
{% block title %}Page Not Found — FitAI{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-illustration">🤖</div>
  <div class="error-code">404</div>
  <h1 class="error-title">Page Not Found</h1>
  <p class="error-sub">Looks like this page skipped leg day and ran off somewhere.</p>
  <div class="error-actions">
    <a href="{{ url_for('dashboard.index') }}" class="btn-primary">🏠 Back to Dashboard</a>
    <a href="{{ url_for('exercise.workout') }}" class="btn-secondary">💪 Start a Workout</a>
  </div>
</div>
{% endblock %}
