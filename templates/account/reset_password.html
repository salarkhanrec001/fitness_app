{% extends "base.html" %}
{% block title %}Reset Password — FitAI{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="auth-logo-icon">🔐</span>
      <h1 class="auth-logo-text">Reset Password</h1>
      <p class="auth-tagline">Enter your OTP and new password</p>
    </div>
    <h2 class="auth-title">Enter New Password</h2>
    <form method="POST" action="{{ url_for('account.reset_password') }}" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="otp" class="form-label">OTP Code</label>
        <input
          type="text"
          id="otp"
          name="otp"
          class="form-input otp-input"
          placeholder="6-digit code"
          maxlength="6"
          pattern="\d{6}"
          required
          autocomplete="one-time-code"
        />
      </div>
      <div class="form-group">
        <label for="new_password" class="form-label">New Password</label>
        <input type="password" id="new_password" name="new_password" class="form-input" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password" />
      </div>
      <div class="form-group">
        <label for="confirm_password" class="form-label">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="Repeat new password" required autocomplete="new-password" />
      </div>
      <button type="submit" class="btn-auth">
        <span class="btn-text">Reset Password</span>
        <span class="btn-icon">→</span>
      </button>
    </form>
    <p class="auth-switch">
      <a href="{{ url_for('account.forgot_password') }}" class="auth-link">← Request a new OTP</a>
    </p>
  </div>
</div>
{% endblock %}
