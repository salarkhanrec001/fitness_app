{% extends "base.html" %}
{% block title %}Forgot Password — FitAI{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="auth-logo-icon">🔑</span>
      <h1 class="auth-logo-text">Forgot Password</h1>
      <p class="auth-tagline">We'll send you a reset code</p>
    </div>
    <h2 class="auth-title">Reset Your Password</h2>
    <form method="POST" action="{{ url_for('account.forgot_password') }}" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-input"
          placeholder="you@example.com"
          required
          autocomplete="email"
        />
      </div>
      <button type="submit" class="btn-auth">
        <span class="btn-text">Send OTP</span>
        <span class="btn-icon">→</span>
      </button>
    </form>
    <p class="auth-switch">
      Remember your password? <a href="{{ url_for('auth.login') }}" class="auth-link">Sign in</a>
    </p>
    <p class="auth-switch">
      Have an OTP already? <a href="{{ url_for('account.reset_password') }}" class="auth-link">Enter it here</a>
    </p>
  </div>
</div>
{% endblock %}
