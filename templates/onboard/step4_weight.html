{% extends "base.html" %}
{% block title %}Step 4 — Weight | FitAI{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/onboard.css') }}" />{% endblock %}
{% block content %}
<div class="onboard-wrapper">
  <div class="onboard-progress">
    <div class="progress-bar"><div class="progress-fill" style="width: 66.6%"></div></div>
    <span class="progress-label">Step 4 of 6</span>
  </div>
  <div class="onboard-card">
    <div class="onboard-icon">⚖️</div>
    <h2 class="onboard-title">What is your weight?</h2>
    <p class="onboard-sub">This helps us set the right calorie and training targets.</p>
    <form method="POST" action="{{ url_for('onboarding.step4') }}" class="onboard-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="form-group">
        <label for="weight_kg" class="form-label">Weight (kilograms)</label>
        <div class="input-unit-wrap">
          <input
            type="number"
            id="weight_kg"
            name="weight_kg"
            class="form-input onboard-input"
            placeholder="e.g. 75"
            value="{{ profile.weight_kg or '' }}"
            min="20"
            max="500"
            step="0.1"
            required
            autofocus
          />
          <span class="unit-badge">kg</span>
        </div>
      </div>
      <button type="submit" class="btn-onboard">Continue <span>→</span></button>
    </form>
  </div>
</div>
{% endblock %}
