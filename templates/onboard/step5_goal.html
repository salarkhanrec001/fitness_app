{% extends "base.html" %}
{% block title %}Step 5 — Fitness Goal | FitAI{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/onboard.css') }}" />{% endblock %}
{% block content %}
<div class="onboard-wrapper">
  <div class="onboard-progress">
    <div class="progress-bar"><div class="progress-fill" style="width: 83.3%"></div></div>
    <span class="progress-label">Step 5 of 6</span>
  </div>
  <div class="onboard-card">
    <div class="onboard-icon">🎯</div>
    <h2 class="onboard-title">What is your main goal?</h2>
    <p class="onboard-sub">Your AI plan will be built around this objective.</p>
    <form method="POST" action="{{ url_for('onboarding.step5') }}" class="onboard-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="choice-grid choice-grid--wide">
        <label class="choice-card {% if profile.fitness_goal == 'lose_weight' %}selected{% endif %}">
          <input type="radio" name="fitness_goal" value="lose_weight" {% if profile.fitness_goal == 'lose_weight' %}checked{% endif %} />
          <span class="choice-icon">🔥</span>
          <span class="choice-label">Lose Weight</span>
        </label>
        <label class="choice-card {% if profile.fitness_goal == 'build_muscle' %}selected{% endif %}">
          <input type="radio" name="fitness_goal" value="build_muscle" {% if profile.fitness_goal == 'build_muscle' %}checked{% endif %} />
          <span class="choice-icon">💪</span>
          <span class="choice-label">Build Muscle</span>
        </label>
        <label class="choice-card {% if profile.fitness_goal == 'stay_fit' %}selected{% endif %}">
          <input type="radio" name="fitness_goal" value="stay_fit" {% if profile.fitness_goal == 'stay_fit' %}checked{% endif %} />
          <span class="choice-icon">🏃</span>
          <span class="choice-label">Stay Fit</span>
        </label>
        <label class="choice-card {% if profile.fitness_goal == 'increase_endurance' %}selected{% endif %}">
          <input type="radio" name="fitness_goal" value="increase_endurance" {% if profile.fitness_goal == 'increase_endurance' %}checked{% endif %} />
          <span class="choice-icon">🚴</span>
          <span class="choice-label">Endurance</span>
        </label>
        <label class="choice-card {% if profile.fitness_goal == 'improve_flexibility' %}selected{% endif %}">
          <input type="radio" name="fitness_goal" value="improve_flexibility" {% if profile.fitness_goal == 'improve_flexibility' %}checked{% endif %} />
          <span class="choice-icon">🧘</span>
          <span class="choice-label">Flexibility</span>
        </label>
        <label class="choice-card {% if profile.fitness_goal == 'six_pack' %}selected{% endif %}">
          <input type="radio" name="fitness_goal" value="six_pack" {% if profile.fitness_goal == 'six_pack' %}checked{% endif %} />
          <span class="choice-icon">🏆</span>
          <span class="choice-label">Six Pack</span>
        </label>
      </div>
      <button type="submit" class="btn-onboard">Continue <span>→</span></button>
    </form>
  </div>
</div>
{% endblock %}
